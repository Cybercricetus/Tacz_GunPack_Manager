[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tacz-updater"
version = "0.1.0"
description = "A conservative CurseForge updater for TaCZ gun pack archives"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cybercricetus" }]
dependencies = [
  "filelock>=3.16,<4",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
]

[project.scripts]
tacz-update = "tacz_updater.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tacz_updater"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

